<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canta Bingo</title>
  <style>
    :root {
      --ink: #34304a;
      --muted: #6d687d;
      --purple: #7654d6;
      --pink: #ef6a9c;
      --yellow: #f4c95d;
      --border: #eee8f4;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      font-family: system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, #ffe2ed 0, transparent 28%),
        radial-gradient(ellipse at 90% 18%, #fff0c4 0, transparent 25%),
        radial-gradient(ellipse at 82% 90%, #dff5ec 0, transparent 28%),
        #fffaf2;
    }

    /* Confeti suave decorativo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        radial-gradient(circle, #ef6a9c 2px, transparent 3px),
        radial-gradient(circle, #f4c95d 2px, transparent 3px),
        radial-gradient(circle, #67c8b0 2px, transparent 3px),
        radial-gradient(circle, #9179e8 2px, transparent 3px);
      background-size: 95px 105px, 130px 120px, 155px 135px, 115px 145px;
      background-position: 12px 25px, 48px 12px, 80px 63px, 25px 90px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      padding: 32px;
      overflow: hidden;
      border: 1px solid #ffffff;
      border-radius: 24px;
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 18px 55px rgb(91 65 130 / 14%);
    }

    main::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 8px;
      background: linear-gradient(
        90deg,
        var(--pink),
        var(--yellow),
        #66c9ad,
        #9179e8
      );
    }

    .brand {
      margin-bottom: 28px;
      text-align: center;
    }

    .brand-mark {
      display: inline-grid;
      width: 64px;
      height: 64px;
      margin-bottom: 10px;
      place-items: center;
      border-radius: 20px;
      color: white;
      font-size: 30px;
      background: linear-gradient(135deg, #f17aa7, #8a6bdd);
      box-shadow: 0 8px 18px rgb(118 84 214 / 20%);
    }

    h1 {
      margin: 0;
      color: var(--purple);
      font-size: clamp(2rem, 8vw, 2.5rem);
      letter-spacing: -1px;
    }

    .tagline {
      margin: 6px 0 0;
      color: var(--muted);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    label {
      display: block;
      margin: 17px 0 7px;
      font-size: .95rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #fffdfd;
      color: var(--ink);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: #a28be8;
      box-shadow: 0 0 0 4px rgb(145 121 232 / 15%);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px 16px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(110deg, #795bd7, #a15fcb);
      box-shadow: 0 6px 14px rgb(118 84 214 / 20%);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform .15s, box-shadow .15s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 9px 18px rgb(118 84 214 / 25%);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    button.secondary {
      color: #6d55b6;
      background: #f2edff;
      box-shadow: none;
    }

    #message {
      min-height: 1.5em;
      margin-bottom: 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .note {
      padding: 14px;
      border: 1px solid #f3e5b6;
      border-radius: 12px;
      color: #665b3d;
      background: #fff9e7;
      line-height: 1.55;
    }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      main { padding: 27px 22px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">🎉</div>
      <h1>Canta Bingo</h1>
      <p class="tagline">¡Tu próxima partida empieza aquí!</p>
    </header>

    <section id="authPanel">
      <h2>Registro o ingreso</h2>

      <form id="authForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" autocomplete="email" required>

        <label for="password">Contraseña</label>
        <input id="password" type="password"
               autocomplete="current-password" minlength="6" required>

        <button id="submitButton" type="submit">Ingresar</button>
      </form>

      <button id="toggleMode" class="secondary" type="button">
        ¿No tienes cuenta? Registrarte
      </button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="nextStep" hidden>
      <h2 id="welcome"></h2>
      <p class="note">
        Siguiente paso: asignación de área. La base de datos todavía no tiene
        un catálogo de áreas, así que esta versión no asigna ni guarda ninguna.
      </p>
      <button id="signOut" class="secondary" type="button">Cerrar sesión</button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Completa estos valores desde la configuración del proyecto.
    const SUPABASE_URL = "https://lzzkgnntpnzwffunemqo.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gsj1KCUdHSMG0n6DIW2IOg_sP1up-Gv";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const authPanel = document.querySelector("#authPanel");
    const nextStep = document.querySelector("#nextStep");
    const form = document.querySelector("#authForm");
    const message = document.querySelector("#message");
    const submitButton = document.querySelector("#submitButton");
    const toggleMode = document.querySelector("#toggleMode");

    let registering = false;

    toggleMode.addEventListener("click", () => {
      registering = !registering;
      submitButton.textContent = registering ? "Crear cuenta" : "Ingresar";
      toggleMode.textContent = registering
        ? "¿Ya tienes cuenta? Ingresar"
        : "¿No tienes cuenta? Registrarte";
      document.querySelector("#password").autocomplete =
        registering ? "new-password" : "current-password";
      message.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      message.textContent = "";

      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      try {
        if (registering) {
          const { data, error } = await client.auth.signUp({ email, password });
          if (error) throw error;

          message.textContent = data.session
            ? "Cuenta creada e ingreso iniciado."
            : "Cuenta creada. Revisa tu correo para confirmar el registro.";
        } else {
          const { error } = await client.auth.signInWithPassword({
            email,
            password
          });
          if (error) throw error;
        }
      } catch (error) {
        message.textContent =
          error.message || "No se pudo completar la operación.";
      } finally {
        submitButton.disabled = false;
      }
    });

    async function updateScreen(session) {
      const user = session?.user;

      authPanel.hidden = Boolean(user);
      nextStep.hidden = !user;

      if (user) {
        document.querySelector("#welcome").textContent =
          `¡Hola, ${user.email || "jugador"}!`;
      }
    }

    client.auth.getSession().then(({ data }) => updateScreen(data.session));
    client.auth.onAuthStateChange((_event, session) => updateScreen(session));

    document.querySelector("#signOut").addEventListener("click", async () => {
      const { error } = await client.auth.signOut();
      if (error) message.textContent = error.message;
    });
  </script>
</body>
</html>
